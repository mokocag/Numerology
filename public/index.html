<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Numerology Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro">
        <h1>Numerology Calculator</h1>
        <p>Discover the vibration of your name and birthday with a single click.</p>
      </section>
      <form class="numerology-form" autocomplete="on">
        <label class="field">
          <span class="field-label">Full name</span>
          <input type="text" name="name" placeholder="e.g. Ada Lovelace" required />
        </label>
        <label class="field">
          <span class="field-label">Birth date</span>
          <input type="date" name="birthdate" required />
        </label>
        <button type="submit">Calculate</button>
      </form>
      <section class="results" aria-live="polite">
        <h2>Your number will appear here</h2>
        <p>Submit the form to generate a numerology reading.</p>
      </section>
    </main>
  </body>
</html>
